<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 아기 이름 추천</title>
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero__content">
        <p class="eyebrow">BABY NAME GUIDE 2026</p>
        <h1 id="page-title">2026년 아기 이름 추천</h1>
        <p class="intro">부르기 쉽고 오래 들어도 자연스러운 이름을 남아, 여아, 중성 느낌으로 5개씩 추천합니다.</p>
      </div>
      <aside class="spotlight" aria-live="polite">
        <span class="spotlight__label">오늘의 추천 이름</span>
        <strong id="featured-name">서아</strong>
        <p id="featured-meaning">맑고 단정한 느낌의 이름</p>
        <button id="shuffle-btn" class="primary-button" type="button">다른 이름 보기</button>
      </aside>
    </section>

    <section class="filters" aria-label="이름 추천 필터">
      <button class="filter-button is-active" type="button" data-filter="all">전체</button>
      <button class="filter-button" type="button" data-filter="boy">남아</button>
      <button class="filter-button" type="button" data-filter="girl">여아</button>
      <button class="filter-button" type="button" data-filter="neutral">중성</button>
    </section>

    <section class="recommendations" aria-labelledby="recommend-title">
      <div class="section-heading">
        <h2 id="recommend-title">이름 추천 목록</h2>
        <p id="summary">카드를 누르면 후보 이름으로 저장됩니다.</p>
      </div>
      <div id="name-groups" class="name-groups"></div>
    </section>

    <section class="shortlist" aria-labelledby="shortlist-title">
      <div class="section-heading">
        <h2 id="shortlist-title">저장한 후보</h2>
        <button id="clear-btn" class="secondary-button" type="button">비우기</button>
      </div>
      <div id="saved-names" class="saved-names">아직 저장한 이름이 없습니다.</div>
    </section>
  </main>
  <script defer src="/main.js"></script>
</body>
</html>
